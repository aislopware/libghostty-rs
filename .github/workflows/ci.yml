name: CI

# The crates build for macOS and iOS 27.2 on Apple silicon only, on an Apple
# silicon Mac, so every job runs on the macOS runner the prebuilt workflow
# uses.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` covers a retargeted base.
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS aarch64
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      # The iOS check and the examples build against the 27.2 SDKs, which the
      # xcode-27 image has in Xcode 27.2 (not its default).
      - name: Select Xcode 27.2
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_27.2*.app | sort | tail -n 1)
          sudo xcode-select --switch "$app"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Use Ghostty binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ghostty
          skipPush: true

      - name: Build package derivation
        run: nix build .#default --print-build-logs

      - name: Run flake checks
        run: nix flake check --print-build-logs

      # Exercises the prebuilt iOS libraries: prebuilt.toml lists them, and the
      # build script downloads, verifies and unpacks them. The source build of
      # the xcframework path runs in the prebuilt workflow.
      - name: Check iOS prebuilt libraries
        run: |
          nix develop -c cargo check --locked -p libghostty-vt-sys --target aarch64-apple-ios
          nix develop -c cargo check --locked -p libghostty-vt-sys --target aarch64-apple-ios-sim

      # The examples are their own workspace, so the flake checks above never
      # build them. `--locked` also fails if example/Cargo.lock is stale.
      - name: Build examples
        run: nix develop -c cargo build --locked --manifest-path example/Cargo.toml --workspace

  miri:
    name: macOS Miri
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Miri soundness checks
        run: nix run .#miri
