name: Windows CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    # `edited` covers a retargeted base, which happens to every stacked PR
    # once the one below it merges.
    types: [opened, synchronize, reopened, edited]
    branches: [master, "release/**", "stack/ghostty-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64 MSVC
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          # Zig installs the static archive as ghostty-vt-static.lib for every
          # Windows ABI, so the GNU targets need their own coverage: rustc
          # resolves static native libraries by a different file name there.
          # Upstream only builds lib-vt for the GNU ABI; running the tests here
          # is the first place the GNU static link is actually exercised.
          - name: Windows x86_64 GNU
            runner: windows-latest
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # No Windows library is prebuilt, so build the pinned ghostty from
      # source: build.rs runs Zig only for a GHOSTTY_SOURCE_DIR. The pin and
      # the Zig version are read from build.rs, where they live.
      - name: Check out ghostty at the pin
        shell: bash
        run: |
          set -euo pipefail
          file=crates/libghostty-vt-sys/build.rs
          repo=$(sed -n 's/^const GHOSTTY_REPO: &str = "\(.*\)";$/\1/p' "$file")
          commit=$(sed -n 's/^const GHOSTTY_COMMIT: &str = "\([0-9a-f]\{40\}\)";$/\1/p' "$file")
          zig=$(sed -n 's/^const ZIG_VERSION: &str = "\(.*\)";$/\1/p' "$file")
          # Cargo's nested OUT_DIR plus Ghostty's fuzz corpus names can exceed
          # Windows MAX_PATH. Scope long-path support to this checkout.
          git init -q ghostty
          git -C ghostty config core.longpaths true
          git -C ghostty remote add origin "$repo"
          git -C ghostty fetch -q --depth 1 origin "$commit"
          git -C ghostty checkout -q FETCH_HEAD
          # Git Bash paths are POSIX; Cargo and Zig need the Windows form.
          echo "GHOSTTY_SOURCE_DIR=$(cygpath -m "$PWD/ghostty")" >> "$GITHUB_ENV"
          echo "ZIG_VERSION=$zig" >> "$GITHUB_ENV"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-workspace-crates: true

      - name: Build libghostty-vt
        run: cargo build -p libghostty-vt --target ${{ matrix.target }}

      - name: Test libghostty-vt
        run: cargo test -p libghostty-vt --lib --target ${{ matrix.target }}

      # Upstream exercises both link modes (c-vt-static links the archive,
      # c-vt and most other examples link the shared library), so cover the
      # dynamic path too. Cargo puts the build script's link-search dirs on
      # PATH, so the test binaries find ghostty-vt.dll at runtime.
      - name: Test libghostty-vt (link-dynamic)
        run: cargo test -p libghostty-vt --lib --features link-dynamic --target ${{ matrix.target }}
